<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2747"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Permutas DBM"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Permutas DBM 1/18</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial;background:#f2f6fc;color:#142842}header{background:#0b2747;color:white;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:60px}header img{width:34px;height:34px;border-radius:8px}header strong{flex:1}a{color:inherit}header a{font-size:12px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 60px);background:#fff}#help{padding:18px;max-width:560px;margin:20px auto;background:white;border:1px solid #dbe5f1;border-radius:12px;line-height:1.6}button{background:#0b2747;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}#help a{color:#145a9e}#install{display:none;margin-left:auto}@media(display-mode:standalone){header{min-height:48px}iframe{height:calc(100dvh - 48px)}}</style></head>
<body><header><img src="./icons/icon-192.png" alt="Caminhão de bombeiro"><strong>Permutas DBM 1/18</strong><button id="install">Instalar</button><a id="external" href="https://script.google.com/macros/s/AKfycbzmqEYIlUiKao_bHQTwvhk8g9rOd-yjQGejGHr1brFIQ1LFfrzpmSxaZaO-Tpl92bQ7SA/exec" target="_blank" rel="noopener">Abrir direto</a></header>
<iframe title="Sistema de permutas" id="app" src="https://script.google.com/macros/s/AKfycbzmqEYIlUiKao_bHQTwvhk8g9rOd-yjQGejGHr1brFIQ1LFfrzpmSxaZaO-Tpl92bQ7SA/exec" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<noscript><div id="help">Ative JavaScript para abrir o aplicativo. Use o link “Abrir direto”.</div></noscript>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}let deferredPrompt;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='inline-block'});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.style.display='none'});</script></body></html>
